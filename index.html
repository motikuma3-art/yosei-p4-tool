const debuffIcon=(d)=>{
  if(d==='water') return iconImg('water');
  if(d==='thunder') return iconImg('fork');
  if(d==='acc'||d==='acc_curse') return iconImg('accel');
  if(d==='curse') return iconImg('curse');
  return '';

const $=id=>document.getElementById(id);
const set=(k,v)=>{S[k]=v;render()};
function setRole(r){S.role=r;localStorage.setItem('role',r);S.step=1;render()}
function roleScreen(){ $('app').classList.add('hidden');$('role').classList.remove('hidden') }
function reset(){S.step=1;S.gc1={};S.gc2={};S.gc3={};S.chaos={};render()}
function pick(gc,k,v){
  if(!S[gc] || typeof S[gc] !== 'object') S[gc]={};
  S[gc][k]=v;
  render();
}
function next(n){S.step=n;render()}
function truth(gc){return S[gc].ex==='true'}
function chaosResult(type, truth){
 if(!type || !truth) return '';
 const donut =
   (type==='つなみ' && truth==='true') ||
   (type==='ほのお' && truth==='false');
 return donut ? 'ドーナツ' : 'たけのこ';
}
function action(debuff,gc){
 const t=truth(gc);
 if(debuff==='acc') return t?'動かない':'動く';
 if(debuff==='curse') return t?'見ない':'見る';
 if(debuff==='thunder') return t?'散開':'頭割り';
 if(debuff==='water') return t?'頭割り':'散開';
 return '';
}
function marker(gc){
 const g=S[gc];
 if(!g.time || !g.ex) return '';
 // マーカー対象は「最終処理が散開」になる人だけ。
 const spread = (g.debuff==='thunder' && g.ex==='true') ||
                (g.debuff==='water' && g.ex==='false');
 if(!spread) return '';
 const fast=g.time==='early'?'早':'遅';
 if(S.role==='dps') return fast==='早'?'アタック1':'アタック2';
 return fast==='早'?'バインド1':'バインド2';
}
function debuffName(d){
 const labels={acc:'加速度',curse:'呪詛',thunder:'雷（フォークライトニング）',water:'水'};
 const keys={acc:'accel',curse:'curse',thunder:'fork',water:'water'};
 return `${iconImg(keys[d],'finalIcon')}${labels[d]||d}`;
}
function render(){
 if(!S.role){$('role').classList.remove('hidden');$('app').classList.add('hidden');return}
 $('role').classList.add('hidden');$('app').classList.remove('hidden');
 if(S.step===1) return gcUI(1);
 if(S.step===2) return gcUI(2);
 if(S.step===3) return gc3UI();
 return finalUI();
}

 const g=S['gc'+n];

 $('step').innerHTML=`

   <div class="action">${c.first||'—'} → ${second}</div>
 </div>
 <button class="btn" style="width:100%" onclick="next(4)">次へ →</button>
 <button class="smallbtn" style="width:100%;margin-top:8px" onclick="next(2)">← GC2を修正</button>
 </div>`;
}

function gc3UI(){
 const g=S.gc3;
 $('step').innerHTML=`<div class="card"><div class="top"><h2>GC3</h2><span class="muted">STEP 3/4</span></div>
 <div class="muted">生者 / 死者の傷</div><div class="row" style="margin-top:8px"><button class="btn ${g.wound==='生者の傷'?'on':''}" onclick="pick('gc3','wound','生者の傷')">${iconImg("life")}生者の傷</button><button class="btn ${g.wound==='死者の傷'?'on':''}" onclick="pick('gc3','wound','死者の傷')">${iconImg("death")}死者の傷</button></div>
 <div class="muted" style="margin-top:13px">アラガンフィールド / 死の超越</div><div class="row" style="margin-top:8px"><button class="btn ${g.field==='アラガンフィールド'?'on':''}" onclick="pick('gc3','field','アラガンフィールド')">${iconImg("allagan")}アラガンフィールド</button><button class="btn ${g.field==='死の超越'?'on':''}" onclick="pick('gc3','field','死の超越')">${iconImg("death_overcome")}死の超越</button></div>
 </div><div class="card"><div class="muted">ビーム</div><div class="action">${g.field?(g.field==='アラガンフィールド'?'異色のビーム':'同じ色のビーム'):'—'}</div></div>
 <button class="btn" style="width:100%" onclick="next(4)">判定結果を見る →</button><button class="smallbtn" style="width:100%;margin-top:8px" onclick="next(2)">← GC2を修正</button></div>`;
}
function finalUI(){
 const exItems=[];
 const chaosItems=[];
 const addEx=(tag,name,act,cls='',timing='')=>exItems.push({tag,name,act,cls,timing});
 const addChaos=(tag,name,act,cls='',timing='')=>chaosItems.push({tag,name,act,cls,timing});

 function timingText(gc){
   const g=S[gc];
   return g.time ? (g.time==='early'?'51s（早）':'1m（遅）') : '';
 }

 function mechanicItem(gc){
   const g=S[gc];
   if(!g.debuff) return;
   const timing=timingText(gc);
   if(g.debuff==='thunder'||g.debuff==='water'){
     addEx('',debuffName(g.debuff),action(g.debuff,gc),
       marker(gc)?'spread':'',timing);
   }else if(g.debuff==='acc_curse'){
     addEx('', `${iconImg('accel','finalIcon')}加速度`, action('acc',gc), '', timing);
     addEx('', `${iconImg('curse','finalIcon')}呪詛`, action('curse',gc), '', timing);
   }else{
     addEx('', `${iconImg('accel','finalIcon')}加速度`, action('acc',gc), '', timing);
   }
 }

 // Exdeath side: show the actual processing information together.
 if(S.gc3.field){
   addEx('GC3・最初の処理',`${iconImg(S.gc3.field==='アラガンフィールド'?'allagan':'death_overcome','finalIcon')}${S.gc3.field}`,
     S.gc3.field==='アラガンフィールド'?'異色のビーム':'同じ色のビーム','beam');
 }
 mechanicItem('gc1');
 mechanicItem('gc2');

 // Chaos side: both attributes are always shown. The first selected
 // attribute determines which truth/lie belongs to fire vs tsunami.
 const first=S.chaos.first;
 if(first){
   const fireTruth = first==='ほのお' ? S.chaos.truth1 : S.chaos.truth2;
   const tsunamiTruth = first==='つなみ' ? S.chaos.truth1 : S.chaos.truth2;
   addChaos('', `${iconImg('fire','finalIcon')}ほのお`, chaosResult('ほのお',fireTruth), 'chaos');
   addChaos('', `${iconImg('chaos_water','finalIcon')}つなみ`, chaosResult('つなみ',tsunamiTruth), 'chaos');
 }

 const markerText=marker('gc1')||marker('gc2');

 const renderItems = (items) => items.map(x=>`
   <div class="item ${x.cls}">
     ${x.timing?`<div class="timingBadge">${x.timing}</div>`:(x.tag?`<div class="tag">${x.tag}</div>`:'')}
     <div class="name">${x.name}</div>
     <div class="action">${x.act}</div>
     ${x.cls==='spread'&&markerText?`<div class="marker">🎯 ${markerText}</div>`:''}
   </div>`).join('');

 $('step').innerHTML=`
 <div class="card">
   <div class="top"><h2>あなたの処理順</h2><button class="smallbtn" onclick="reset()">リセット</button></div>
   <div class="muted">ロール：${S.role==='dps'?'DPS':'タンヒラ'}</div>
 </div>

 <div class="sectionTitle">⚡ エクスデス</div>
 <div class="timeline">${renderItems(exItems)}</div>

 <div class="sectionTitle chaosTitle">🔥🌊 カオス</div>
 <div class="timeline">${renderItems(chaosItems)}</div>

 <button class="smallbtn" style="width:100%;margin-top:10px" onclick="next(3)">← GC3を修正</button>
 </div>`;
}
render();
</script>

</script>
